[package]
name = "allusion"
version = "1.0.0-rc.10"
description = "A tool for managing your visual library"
authors = ["Allusion-App", "Guilherme Moraes"]
edition = "2021"

[lib]
name = "allusion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset", "devtools"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-window-state = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
notify = "6.1"
kamadak-exif = "0.5"
exr = "1.7"
walkdir = "2"
rayon = "1.8"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "gif", "webp", "webp-encoder", "tiff", "bmp", "ico"] }
trash = "5"
open = "5"
arboard = "3.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

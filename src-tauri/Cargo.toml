[package]
name = "allusion"
version = "1.0.0-rc.10"
description = "A tool for managing your visual library"
authors = ["Allusion-App", "Guilherme Moraes"]
edition = "2021"

[lib]
name = "allusion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset", "devtools"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-window-state = "2.0.0"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
notify = "6.1"
kamadak-exif = "0.5"
exr = "1.7"
walkdir = "2"
rayon = "1.8"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "gif", "webp", "webp-encoder", "tiff", "bmp", "ico"] }
trash = "5"
open = "5"
arboard = "3.4"
rusqlite = { version = "0.42", features = ["bundled", "functions"] }
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

# `tauri dev` builds the backend unoptimized, and the thumbnail pipeline is
# pure pixel work inside the `image` crate (decode -> resize -> webp encode ->
# palette). Measured with the same test suite: 6.15s in release vs 175.31s in
# dev, i.e. ~28x slower, which capped thumbnail generation at ~0.15/s and made
# a 1.1k-image library take over an hour. Optimizing dependencies keeps the app
# crate itself in debug (fast rebuilds, backtraces, devtools) while restoring
# real throughput for the native image code.
[profile.dev.package."*"]
opt-level = 3
